name: Payment Proof
description: Submit a transaction hash after paying for Client Follow-Up Kit.
title: "Client Follow-Up Kit payment proof"
labels:
  - payment-proof
body:
  - type: markdown
    attributes:
      value: |
        Use this form after you pay for Client Follow-Up Kit.

        Include the transaction hash and a delivery contact so the buyer zip can be sent after manual verification.
  - type: input
    id: tx_hash
    attributes:
      label: Transaction hash
      description: Paste the ETH transaction hash here.
      placeholder: 0x...
    validations:
      required: true
  - type: input
    id: reply_email
    attributes:
      label: Reply email
      description: Optional but recommended if you want delivery by email.
      placeholder: you@example.com
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional extra delivery context.
      placeholder: Anything helpful for verification or delivery.
    validations:
      required: false
